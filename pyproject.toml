[project]
name = "opennotelm"
version = "0.1.0"
description = "Local-first, source-grounded AI knowledge workspace"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "cryptography>=50.0.2,<51",
  "python-multipart>=0.0.20,<1",
  "beautifulsoup4>=4.13,<5",
  "defusedxml>=0.7,<1",
  "pypdf>=6,<7",
  "markdown-it-py>=4,<5",
  "playwright>=1.55,<2",
  "pillow>=12,<13",
  "reportlab>=4,<5",
  "pypdfium2>=4.30,<6",
  "trafilatura>=2.1,<3",
]

[project.urls]
Homepage = "https://github.com/daozen/opennotelm"
Repository = "https://github.com/daozen/opennotelm"
Issues = "https://github.com/daozen/opennotelm/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/opennotelm"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = ["browser: requires installed Chromium or RENDER_BROWSER_EXECUTABLE"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
